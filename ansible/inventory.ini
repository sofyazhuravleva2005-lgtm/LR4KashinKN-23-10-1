# inventory.ini — список серверов для Ansible

[pdp_servers]                     # Группа серверов
server1 ansible_host=192.168.10.101
server2 ansible_host=192.168.10.102
server3 ansible_host=192.168.10.103
# ... (можно добавить до 1000 серверов)

[all:vars]                        # Общие переменные
ansible_user=admin
ansible_ssh_private_key_file=~/.ssh/id_rsa