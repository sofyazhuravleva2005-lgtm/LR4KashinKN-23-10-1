---
- name: Развёртывание ПДП-Контейнера
  hosts: production_servers
  become: yes
  vars:
    container_version: "1.2.3"
  tasks:
    - name: Установка Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Запуск контейнера ПДП
      docker_container:
        name: pdp-container
        image: "yourname/pdp-container:{{ container_version }}"
        state: started
        restart_policy: always
        env:
          THRESHOLD: "92"
          IMP_S1_KASHIN: "{{ lookup('env', 'SECRET_KEY') }}"
        ports:
          - "8000:8000"

    - name: Проверка работоспособности
      uri:
        url: "http://localhost:8000"
        status_code: 200