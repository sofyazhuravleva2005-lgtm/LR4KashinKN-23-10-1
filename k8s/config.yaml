apiVersion: v1
kind: ConfigMap
metadata:
  name: pdp-config
data:
  THRESHOLD: "95"
  IMP_S1_KASHIN: "secret_key_1"
  IMP_S2_KASHIN: "secret_key_2"
  IMP_S3_KASHIN: "secret_key_3"

---
apiVersion: v1
kind: Pod
metadata:
  name: pdp-pod
  labels:
    app: pdp-container
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80

    - name: pdp-web
      image: 13mateo/pdp-container:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 8000
      envFrom:
        - configMapRef:
            name: pdp-config
    

    - name: postgres
      image: postgres:15
      env:
        - name: POSTGRES_DB
          value: pdp_db
        - name: POSTGRES_USER
          value: pdp_user
        - name: POSTGRES_PASSWORD
          value: pdp_password
      ports:
        - containerPort: 5432

    - name: adminer
      image: adminer:latest
      ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: pdp-service
spec:
  type: NodePort
  selector:
    app: pdp-container
  ports:
    - name: web
      port: 8000
      targetPort: 8000
      nodePort: 30080
    - name: adminer
      port: 8080
      targetPort: 8080
      nodePort: 30081